<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <title>Gastro Perú Galería</title>
      <meta name="description" content="Espacio de Gastro Perú dedicado a una galería de las mejoras recetas seleccionadas por el equipo de Gastro Perú">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="preload" href="../css/main.scss" as="style" onload="this.onload=null;this.rel='stylesheet'">
      <noscript><link rel="stylesheet" href="../css/main.scss"></noscript>
      <script type="module" src="../script/script.js"></script>
      <link rel="preload" as="image"
         href="../img/pescado_crudo.jpg?as=webp&width=460&quality=80"
         imagesrcset="../img/pescado_crudo.jpg?as=webp&width=460&quality=80 460w,
                     ../img/pescado_crudo.jpg?as=webp&width=700&quality=80 700w,
                     ../img/pescado_crudo.jpg?as=webp&width=800&quality=75 800w"
         imagesizes="(min-width: 1025px) 800px, (min-width: 460px) 700px, 460px"
         fetchpriority="high">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
      <link rel="stylesheet"
         href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
         media="print" onload="this.media='all'">
      <noscript>
         <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
      </noscript>
      <link rel="icon" href="../img/favicon.ico">
   </head>
   <body class="container">
      <include src="componentes/header.html"></include>
      <main>
         <h1>Galería</h1>
         <p>Descubre las mejores recetas de la gastronomía peruana a través de esta galería de imágenes</p>
         <div class="galeria">
            <p>Optimización de imágenes - Diferente tamaño</p>
            <div>
               <figure>
                  <figcaption>Imagen original PNG</figcaption>
                  <img
                     src="../img/ceviche.jpg"
                     alt="Imagen de un plato de ceviche en formato png"
                     width="1920" height="1080"
                     loading="eager"
                     fetchpriority="high"
                     decoding="async"
                  >
               </figure>
               <figure>
                  <figcaption>Imagen webp para móvil (460px)</figcaption>
                  <picture>
                     <source
                        type="image/webp"
                        srcset="../img/ceviche.jpg?as=webp&width=460&quality=60"
                        sizes="(max-width: 480px) 100vw, 460px"
                     >
                     <img
                        src="../img/ceviche.jpg"
                        alt="Imagen de un plato de ceviche optimizada para móvil"
                        width="460" height="259"
                        loading="lazy"
                        decoding="async"
                     >
                  </picture>
               </figure>
               <figure>
                  <figcaption>Imagen webp para tablet (1024px)</figcaption>
                  <picture>
                     <source
                        type="image/webp"
                        srcset="../img/ceviche.jpg?as=webp&width=1024&quality=70"
                        sizes="(max-width: 1024px) 100vw, 1024px"
                     >
                     <img
                        src="../img/ceviche.jpg"
                        alt="Imagen de un plato de ceviche optimizada para tablet"
                        width="1024" height="576"
                        loading="lazy"
                        decoding="async"
                     >
                  </picture>
               </figure>
               <figure>
                  <figcaption>Imagen webp para escritorio (1920px)</figcaption>
                  <picture>
                     <source
                        type="image/webp"
                        srcset="../img/ceviche.jpg?as=webp&width=1920&quality=80"
                        sizes="100vw"
                     >
                     <img
                        src="../img/ceviche.jpg"
                        alt="Imagen de un plato de ceviche optimizada para escritorio"
                        width="1920" height="1080"
                        loading="lazy"
                        decoding="async"
                     >
                  </picture>
               </figure>

            </div>
         </div>
         <div class="galeria">
            <p>Optimización de imágenes - Diferente resolución</p>
            <div>
               <figure>
                  <figcaption>Resolución a 1x</figcaption>
                  <picture>
                     <source
                        type="image/webp"
                        srcset="../img/lomo_saltado.jpg?as=webp&width=600&quality=75 1x"
                     >
                     <img
                        src="../img/lomo_saltado.jpg"
                        alt="Imagen de lomo saltado optimizada a 1x"
                        width="600" height="400"
                        loading="lazy"
                        decoding="async"
                     >
                  </picture>
               </figure>
               <figure>
                  <figcaption>Resolución a 1.5x</figcaption>
                  <picture>
                     <source
                        type="image/webp"
                        srcset="../img/lomo_saltado.jpg?as=webp&width=1200&quality=75 1.5x"
                     >
                     <img
                        src="../img/lomo_saltado.jpg"
                        alt="Imagen de lomo saltado optimizada a 1.5x"
                        width="600" height="400"
                        loading="lazy"
                        decoding="async"
                     >
                  </picture>
               </figure>
               <figure>
                  <figcaption>Resolución a 2x</figcaption>
                  <picture>
                     <source
                        type="image/webp"
                        srcset="../img/lomo_saltado.jpg?as=webp&width=1800&quality=75 2x"
                     >
                     <img
                        src="../img/lomo_saltado.jpg"
                        alt="Imagen de lomo saltado optimizada a 2x"
                        width="600" height="400"
                        loading="lazy"
                        decoding="async"
                     >
                  </picture>
               </figure>

            </div>
         </div>
         <div class="galeria">
            <p>Art Direction - Diferente recorte según dispositivo</p>
            <div>
               <figure>
                  <figcaption>Móvil: recorte cuadrado centrado</figcaption>
                  <picture>
                     <source
                        media="(max-width: 599px)"
                        type="image/webp"
                        srcset="../img/GastroPeru.jpg?as=webp&width=300&height=300&fit=cover 1x,
                                ../img/GastroPeru.jpg?as=webp&width=600&height=600&fit=cover 2x"
                     >
                     <source type="image/webp" srcset="../img/GastroPeru.jpg?as=webp&width=1920&quality=80">
                     <img
                        src="../img/GastroPeru.jpg"
                        alt="Imagen de Gastro Perú con recorte cuadrado para móvil"
                        width="300" height="300"
                        loading="lazy"
                        decoding="async"
                     >
                  </picture>
               </figure>
               <figure>
                  <figcaption>Tablet: recorte horizontal</figcaption>
                  <picture>
                     <source
                        media="(min-width: 600px) and (max-width: 1023px)"
                        type="image/webp"
                        srcset="../img/GastroPeru.jpg?as=webp&width=1024&height=576&fit=cover 1x,
                                ../img/GastroPeru.jpg?as=webp&width=2048&height=1152&fit=cover 2x"
                     >
                     <source type="image/webp" srcset="../img/GastroPeru.jpg?as=webp&width=1920&quality=80">
                     <img
                        src="../img/GastroPeru.jpg"
                        alt="Imagen de Gastro Perú con recorte horizontal para tablet"
                        width="1024" height="576"
                        loading="lazy"
                        decoding="async"
                     >
                  </picture>
               </figure>
               <figure>
                  <figcaption>Escritorio: imagen completa</figcaption>
                  <picture>
                     <source
                        media="(min-width: 1024px)"
                        type="image/webp"
                        srcset="../img/GastroPeru.jpg?as=webp&width=1920&height=1080&fit=cover 1x,
                                ../img/GastroPeru.jpg?as=webp&width=3840&height=2160&fit=cover 2x"
                     >
                     <source type="image/webp" srcset="../img/GastroPeru.jpg?as=webp&width=1920&quality=80">
                     <img
                        src="../img/GastroPeru.jpg"
                        alt="Imagen de Gastro Perú completa para escritorio"
                        width="1920" height="1080"
                        loading="lazy"
                        decoding="async"
                     >
                  </picture>
               </figure>
            </div>
         </div>
      </main>
      <include src="componentes/footer.html"></include>
   </body>
</html>
